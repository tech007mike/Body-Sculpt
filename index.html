<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Body Sculpt</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff}#app{border:0;width:100%;height:100%;display:block}.calcOverlay{display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);padding:18px;box-sizing:border-box;overflow:auto}.calcCard{width:min(760px,100%);margin:20px auto;background:#15171c;border:1px solid #343844;border-radius:20px;padding:20px;box-sizing:border-box;box-shadow:0 20px 60px #000b}.calcCard h2{margin:0 0 5px}.sub{color:#aeb3bf;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:#b9bec9}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #343844;background:#0f1115;color:#fff;font-size:16px}.field input[type=range]{padding:7px 0;accent-color:#fff}.summary{margin-top:16px;padding:12px;border:1px solid #292c34;border-radius:12px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}.summary span{font-size:11px;color:#9fa5b1}.summary b{display:block;font-size:19px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:right;padding:11px 6px;border-bottom:1px solid #292c34}th:first-child,td:first-child{text-align:left}th{font-size:11px;color:#9fa5b1}.calcActions{display:flex;gap:10px;margin-top:18px}.calcActions button{flex:1;padding:13px;border-radius:12px;border:1px solid #444;background:#20232a;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.calcActions .apply{border-color:rgba(61,214,198,.5);background:linear-gradient(180deg,rgba(61,214,198,.22),rgba(61,214,198,.08))}.calcLaunch{width:100%;padding:12px;margin:0 0 12px;border-radius:12px;border:1px solid rgba(61,214,198,.45);background:linear-gradient(180deg,rgba(61,214,198,.20),rgba(61,214,198,.07));color:#fff;font-weight:950;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}.calcCard{padding:15px;margin:0 auto}th,td{font-size:12px;padding:9px 4px}}
</style></head><body><iframe id="app" src="app.html"></iframe><div id="calcOverlay" class="calcOverlay"><div class="calcCard"><h2>Workout Load Calculator</h2><p class="sub" id="calcExercise">Calculate loads, then update this workout's sets.</p><div class="grid">
<div class="field"><label>Weight done (lb)</label><input id="doneWeight" type="number" inputmode="decimal" value="140.0" min="2.5" max="500" step="2.5"></div>
<div class="field"><label>Reps done: <b id="doneRepsVal">12</b></label><input id="doneReps" type="range" value="12" min="1" max="15" step="1"></div>
<div class="field"><label>Calculated 1RM (lb)</label><input id="oneRM" type="number" readonly></div>
<div class="field"><label>Target reps: <b id="repsVal">12</b></label><input id="reps" type="range" value="12" min="1" max="15" step="1"></div>
<div class="field"><label>Working sets: <b id="setsVal">4</b></label><input id="sets" type="range" value="4" min="1" max="5" step="1"></div>
<div class="field"><label>Drop per set: <b id="dropVal">20%</b></label><input id="drop" type="range" value="20" min="0" max="100" step="5"></div>
<div class="field"><label>Rest: <b id="restVal">60 sec</b></label><input id="rest" type="range" value="60" min="30" max="180" step="30"></div>
<div class="field"><label>Round down to (lb)</label><select id="round"><option value="2.5">2.5</option><option value="5">5</option><option value="10">10</option></select></div></div>
<div class="summary"><div><span>Fresh target</span><b id="fresh">—</b></div><div><span>Working reps</span><b id="totalReps">—</b></div><div><span>Total volume</span><b id="volume">—</b></div><div><span>Rest</span><b id="restOut">—</b></div></div>
<table><thead><tr><th>Set</th><th>% 1RM</th><th>Weight</th><th>Reps</th><th>Volume</th></tr></thead><tbody id="rows"></tbody></table>
<div class="calcActions"><button onclick="closeCalculator()">Cancel</button><button class="apply" onclick="applyCalculatorSets()">Update sets for this workout</button></div></div></div>
<script>
const pct={1:1,2:.95,3:.93,4:.90,5:.87,6:.85,7:.83,8:.80,9:.77,10:.75,11:.72,12:.70,13:.68,14:.66,15:.65};let calcTarget=null,calcRows=[];const $=id=>document.getElementById(id);function rounded(v,inc){return Math.floor((v/inc)+Number.EPSILON)*inc}function fmt(v,inc){return v.toFixed(Number.isInteger(inc)?0:1)}
function calc(){doneRepsVal.textContent=doneReps.value;repsVal.textContent=reps.value;setsVal.textContent=sets.value;dropVal.textContent=drop.value+'%';restVal.textContent=rest.value+' sec';const performed=+doneWeight.value||0,doneR=Math.max(1,Math.min(15,+doneReps.value||1)),rm=performed/(pct[doneR]||1);oneRM.value=rm.toFixed(1);const r=+reps.value,workingSets=Math.max(1,+sets.value||1),d=(+drop.value||0)/100,inc=+round.value,base=rm*pct[r];let vol=0,html='';calcRows=[];const warmRaw=base*.5,warmW=rounded(warmRaw,inc),warmV=warmW*r;vol+=warmV;calcRows.push({label:'Warm Up',weight:warmW,reps:r});html+=`<tr><td>Warm Up</td><td>${rm?(warmRaw/rm*100).toFixed(1):'0.0'}%</td><td><b>${fmt(warmW,inc)} lb</b></td><td>${r}</td><td>${warmV.toLocaleString()}</td></tr>`;for(let set=1;set<=workingSets;set++){const raw=base*Math.pow(1-d,set-1),w=rounded(raw,inc),v=w*r;vol+=v;calcRows.push({label:`Set ${set}`,weight:w,reps:r});html+=`<tr><td>Set ${set}</td><td>${rm?(raw/rm*100).toFixed(1):'0.0'}%</td><td><b>${fmt(w,inc)} lb</b></td><td>${r}</td><td>${v.toLocaleString()}</td></tr>`}rows.innerHTML=html;fresh.textContent=fmt(rounded(base,inc),inc)+' lb';totalReps.textContent=workingSets*r;volume.textContent=vol.toLocaleString()+' lb';restOut.textContent=rest.value+' sec'}
['doneWeight','doneReps','reps','sets','drop','rest','round'].forEach(id=>$(id).addEventListener('input',calc));doneWeight.addEventListener('change',e=>{const n=+e.target.value;if(Number.isFinite(n))e.target.value=n.toFixed(1)});function openCalculator(groupId,exId){const w=app.contentWindow,g=w.APP?.groups.find(x=>x.id===groupId),ex=g?.exercises.find(e=>e.id===exId);if(!g||!ex)return;calcTarget={groupId,exId};calcExercise.textContent=`${ex.name} — calculate loads, then update this workout's sets.`;calcOverlay.style.display='block';calc()}function closeCalculator(){calcOverlay.style.display='none';calcTarget=null}
function applyCalculatorSets(){if(!calcTarget||!calcRows.length)return;const w=app.contentWindow,g=w.APP?.groups.find(x=>x.id===calcTarget.groupId),ex=g?.exercises.find(e=>e.id===calcTarget.exId);if(!g||!ex)return;const oldLabels=[...w.getExerciseSetLabels(ex)],newLabels=calcRows.map(x=>x.label);w.migrateWorkoutKeys_ExerciseSetLabels(g,ex,oldLabels,newLabels);ex.setLabels=newLabels;ex.percentageConfig={enabled:false,maxWeight:0,maxReps:0};w.saveAppData(w.APP);calcRows.forEach(row=>{const key=`${w.KEY_PREFIX}${w.safeKey(g.name)}::${w.safeKey(ex.name)}::${w.safeKey(row.label)}`;w.localStorage.setItem(key,JSON.stringify({weight:row.weight,set:row.reps}))});closeCalculator();w.closeModal();if(w.CURRENT_GROUP_ID===g.id)w.openGroupPanel(g.id)}
app.addEventListener('load',()=>{const w=app.contentWindow;if(typeof w.openSetSettings!=='function')return;const original=w.openSetSettings;w.openSetSettings=function(groupId,exId){original.call(w,groupId,exId);setTimeout(()=>{const modal=w.document.getElementById('modal');if(!modal)return;modal.querySelector('.percent-box')?.remove();[...modal.querySelectorAll('.hint')].forEach(h=>{if(/percentage breakdown/i.test(h.textContent||''))h.remove()});if(modal.querySelector('.calcLaunch'))return;const h3=modal.querySelector('h3');const b=w.document.createElement('button');b.className='calcLaunch';b.textContent='Calculate using calculator';b.onclick=()=>openCalculator(groupId,exId);h3?.insertAdjacentElement('afterend',b)},0)}});calc();
</script></body></html>
